<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget ADV BeeFamily</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1>Budget ADV <span>BeeFamily</span></h1>
        <p class="sub" id="freshness">Caricamento…</p>
      </div>
      <button class="who" id="who" type="button">Accedi</button>
    </div>
    <nav class="months" id="months" aria-label="Mese"></nav>
    <div class="toolbar">
      <label class="toggle"><input type="checkbox" id="onlyOff"> Solo fuori ritmo</label>
      <span class="sub" id="count"></span>
    </div>
  </header>
  <main>
    <div id="banners"></div>
    <section id="cards" class="cards" aria-live="polite"></section>
    <section id="unassigned"></section>
  </main>
  <div id="detail" class="detail" hidden></div>
  <div id="dialog" class="dialog" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
